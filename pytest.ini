[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage отключен по умолчанию для Docker (можно включить через --cov)
addopts = 
    -v
    --strict-markers
    --tb=short
# Настройка для работы coverage (раскомментировать при необходимости)
# --cov=src
# --cov-report=term-missing
# --cov-report=html
# --cov-fail-under=70

# Настройка для работы coverage в Docker/CI
[coverage:run]
parallel = false
data_file = {env:COVERAGE_FILE:/tmp/.coverage}

[coverage:report]
# Путь для HTML отчета
html_dir = {env:COVERAGE_HTML_DIR:/tmp/htmlcov}

